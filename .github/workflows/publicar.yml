# Publica la carpeta sitio/ en GitHub Pages cada vez que se suben cambios a main.
# (GitHub Pages solo publica la raíz o docs/; con esto se publica sitio/ sin cambiar la estructura.)
# En GitHub: Settings → Pages → Source: "GitHub Actions".
name: Publicar el CV

on:
  push:
    branches: [main]
  workflow_dispatch:        # también se puede correr a mano desde la solapa Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacion.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: publicacion
        uses: actions/deploy-pages@v4
