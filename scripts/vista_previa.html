<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Molde de la imagen que aparece al pegar el link en WhatsApp / LinkedIn (1200 × 630).
         No se publica: scripts/armar_imagenes.py le saca una captura y la guarda en sitio/img/vista-previa.jpg -->
    <link rel="stylesheet" href="../sitio/fuentes/fuentes.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { width: 1200px; height: 630px; overflow: hidden; background: #f6f2ea; font-family: 'Inter', sans-serif; color: #33454b;
               display: grid; grid-template-columns: 460px 1fr; }
        .foto { position: relative; background: #cfe4f1; }
        .foto img { position: absolute; inset: 0 28px 28px 0; width: calc(100% - 28px); height: calc(100% - 28px); object-fit: cover; object-position: top; }
        .texto { padding: 70px 72px; display: flex; flex-direction: column; }
        .volanta { font-size: 19px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #2f7fa8; }
        h1 { font-family: 'Source Serif 4', serif; font-weight: 400; font-size: 86px; line-height: 1; color: #13363f; margin: 22px 0 26px; }
        p { font-size: 25px; line-height: 1.5; }
        .pie { margin-top: auto; padding-top: 26px; border-top: 2px solid #ddd5c6; display: flex; gap: 34px; font-size: 21px; color: #13363f; font-weight: 500; }
        .pie b { font-family: 'Source Serif 4', serif; font-weight: 400; font-size: 34px; display: block; line-height: 1; margin-bottom: 4px; }
        .pie span { color: #6b7b80; font-weight: 400; font-size: 18px; }
    </style>
</head>
<body>
    <div class="foto"><img src="../sitio/img/marcia.jpg" alt=""></div>
    <div class="texto">
        <span class="volanta">Supply Chain & International Trade</span>
        <h1>Marcia Catania</h1>
        <p>Operaciones, comercio exterior y logística crítica Pharma. Licenciada en Comercio Exterior · Project Manager.</p>
        <div class="pie">
            <div><b>+14</b><span>años en multinacionales</span></div>
            <div><b>24</b><span>personas a cargo</span></div>
            <div><b>GxP</b><span>ISO 9001 · ANMAT · OEA</span></div>
        </div>
    </div>
</body>
</html>
